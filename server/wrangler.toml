name = "task-board-api"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
# Minify the bundle. Isolate cold start is dominated by parsing the bundled
# MongoDB driver; minification measurably reduces first-request latency.
# NOTE: this MUST stay above every [table] header — in TOML a bare key after
# a table header belongs to that table (it silently became placement.minify
# and was ignored, leaving the bundle unminified).
minify = true

# Smart Placement: moves execution next to the busiest upstream (MongoDB
# Atlas) so every Mongo round trip — handshake AND queries — drops to
# single-digit ms (see Cloudflare "Placement" docs; available on all plans).
# Needs traffic from multiple locations to converge; with single-user traffic
# it may stay INSUFFICIENT_INVOCATIONS. A deterministic alternative is
# `host = "<atlas-cluster-host>:27017"` — the hostname is part of the
# MONGODB_URI secret and is deliberately NOT hardcoded here.
[placement]
# A/B experiment B: explicit region placement next to MongoDB Atlas
# (eu-central-1, Frankfurt). Baseline A (mode=smart) recorded 2026-08-31:
# cf-placement local-WAW on every request (Smart never routed —
# INSUFFICIENT_INVOCATIONS with single-user traffic).
region = "aws:eu-central-1"

# Durable Object holding the Hono app + persistent MongoClient. Only used
# when DB_CLIENT_MODE=durable; the production default stays per-request.
[durable_objects]
bindings = [{ name = "MONGO_DO", class_name = "MongoHonoDurableObject" }]

# SQLite-backed DO (the only backend available on the Workers Free plan).
# The DO stores no application state — it is a durable holder for the Mongo
# client/pool; storage stays empty.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MongoHonoDurableObject"]

[vars]
# MONGODB_URI / JWT_SECRET are deliberately NOT defined here: on `wrangler deploy`
# a [vars] entry overrides the Worker secret of the same name (it would push an
# empty string over the real secret on every deploy). Local dev reads them from
# server/.dev.vars (gitignored); production sets them via `wrangler secret put`
# in .github/workflows/cd.yml.

# Comma-separated list of allowed origins for CORS.
# Local dev default; production overrides it via `wrangler deploy --var` in CD.
# Production MUST set an explicit origin list — never deploy with "*".
ALLOWED_ORIGINS = "http://localhost:4200"

# Suppress esbuild [import-is-undefined] warning caused by unenv's whatwg-url shim
# lacking a default export (used by mongodb → mongodb-connection-string-url).
# See: server/src/shims/whatwg-url.mjs
[alias]
"whatwg-url" = "./src/shims/whatwg-url.mjs"
