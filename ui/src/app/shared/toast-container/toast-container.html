<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
  @for (n of notificationService.notifications(); track n.id) {
    <div
      class="pointer-events-auto flex items-center gap-3 rounded-lg border px-4 py-3 shadow-lg transition-all"
      [class]="getClasses(n.type)"
      role="alert"
    >
      <span class="text-sm font-medium">{{ n.message }}</span>
      <button
        class="ml-2 text-current opacity-60 hover:opacity-100"
        (click)="notificationService.dismiss(n.id)"
        aria-label="Dismiss"
      >
        &times;
      </button>
    </div>
  }
</div>
