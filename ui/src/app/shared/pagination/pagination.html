<div class="flex justify-end">
  <hlm-numbered-pagination
    [currentPage]="page()"
    [totalItems]="total()"
    [itemsPerPage]="pageSize()"
    [pageSizes]="pageSizes()"
    [maxSize]="maxSize()"
    [showEdges]="showEdges()"
    [autoOptionLabel]="autoEnabled() ? ('pagination.auto' | transloco) : null"
    [autoSelected]="isAuto()"
    [totalItemsLabel]="'pagination.totalItems' | transloco"
    [pagesLabel]="''"
    [previousText]="''"
    [nextText]="''"
    (currentPageChange)="onCurrentPageChange($event)"
    (itemsPerPageChange)="onItemsPerPageChange($event)"
    (autoPageSizeChange)="autoPageSizeChange.emit()"
  />
</div>
