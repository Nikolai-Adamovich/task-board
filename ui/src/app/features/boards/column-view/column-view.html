<!-- Column header -->
<div class="flex items-center justify-between border-b border-border px-4 py-3">
  <div class="flex items-center gap-2">
    <h3 class="text-sm font-semibold text-foreground">{{ column().name }}</h3>
    <span hlmBadge variant="secondary">
      {{ tasks().length }}
    </span>
  </div>
  @if (showAddButton()) {
  <button hlmBtn variant="ghost" size="icon-sm" (click)="addTask.emit(column())" aria-label="Add task to column">
    <ng-icon name="lucidePlus" />
  </button>
  }
</div>

<!-- Drop zone / task list -->
<div class="flex-1 space-y-2 overflow-y-auto p-3" [attr.data-column-id]="column().id" (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">
  @for (task of tasks(); track task.id) {
  <ui-task-card [task]="task" (dragStart)="onTaskDragStart($event)" (click)="taskClick.emit(task)" />
  } @empty {
  <div class="py-8 text-center text-xs text-muted-foreground">
    No tasks
  </div>
  }
</div>
