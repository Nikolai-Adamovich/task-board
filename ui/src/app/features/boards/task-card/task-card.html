<div
  class="cursor-pointer rounded-md border border-border bg-card p-3 shadow-sm transition-all hover:shadow-md hover:border-primary/30"
  role="button"
  tabindex="0"
  (keydown.enter)="taskClick.emit(task())"
>
  <div class="flex items-start justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <span class="shrink-0 text-xs font-mono text-muted-foreground">{{ taskLabel() }}</span>
      <h4 class="text-sm font-medium text-foreground line-clamp-2">{{ task().title }}</h4>
    </div>
    <span hlmBadge variant="outline" class="shrink-0 text-[10px] uppercase" [class]="priorityColor()">
      {{ task().priority }}
    </span>
  </div>

  @if (task().description) {
    <p class="mt-1 text-xs text-muted-foreground line-clamp-2">
      {{ task().description }}
    </p>
  }

  <div class="mt-2 flex items-center justify-between">
    <!-- Single assignee -->
    <div class="flex items-center gap-1">
      @if (task().assigneeSnapshot; as assignee) {
        <hlm-avatar class="h-5 w-5 border border-card">
          <div hlmAvatarFallback class="text-[9px] font-medium">
            {{ assigneeInitials() }}
          </div>
        </hlm-avatar>
        <span class="text-[10px] text-muted-foreground">{{ assignee.displayName }}</span>
      } @else {
        <span class="text-[10px] text-muted-foreground italic">Unassigned</span>
      }
    </div>
  </div>
</div>
