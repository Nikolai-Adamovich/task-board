<div class="mx-auto max-w-6xl py-8">
  <h1 class="mb-6 text-2xl font-bold">{{ 'faq.title' | transloco }}</h1>

  <hlm-accordion>
    @for (item of faqItems; track item.question) {
      <hlm-accordion-item>
        <hlm-accordion-trigger>{{ item.question | transloco }}</hlm-accordion-trigger>
        <hlm-accordion-content>{{ item.answer | transloco }}</hlm-accordion-content>
      </hlm-accordion-item>
    }
  </hlm-accordion>
</div>
