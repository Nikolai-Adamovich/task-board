<hlm-card>
  <div hlmCardContent>
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-medium text-foreground">{{ 'filters.title' | transloco }}</h3>
      <button
        hlmBtn
        variant="outline"
        size="sm"
        [disabled]="!hasActiveState()"
        (click)="showSaveForm.set(!showSaveForm())"
      >
        {{ 'filters.saveCurrent' | transloco }}
      </button>
    </div>

    @if (loading()) {
      <div class="flex items-center justify-center py-6">
        <hlm-spinner /> <span class="ml-2 text-sm text-muted-foreground">{{ 'filters.loading' | transloco }}</span>
      </div>
    } @else if (error()) {
      <hlm-alert variant="destructive">
        <div hlmAlertDescription>{{ error() | transloco }}</div>
      </hlm-alert>
    } @else {
      <!-- Save form -->
      @if (showSaveForm()) {
        <div class="mb-4 flex flex-col gap-3 rounded-md border p-3">
          <hlm-field>
            <label hlmFieldLabel for="filter-name">{{ 'filters.name' | transloco }}</label>
            <input
              hlmInput
              id="filter-name"
              type="text"
              [placeholder]="'filters.namePlaceholder' | transloco"
              [value]="filterName()"
              (input)="onFilterNameInput($event)"
            />
          </hlm-field>
          <div class="flex gap-2">
            <button hlmBtn size="sm" (click)="saveFilter()" [disabled]="!filterName().trim() || saving()">
              @if (saving()) {
                <hlm-spinner class="mr-1" /> {{ 'filters.saving' | transloco }}
              } @else {
                {{ 'filters.save' | transloco }}
              }
            </button>
            <button hlmBtn variant="outline" size="sm" (click)="showSaveForm.set(false)">
              {{ 'filters.cancel' | transloco }}
            </button>
          </div>
        </div>
      }

      <!-- Filter list -->
      <div class="flex flex-col gap-2">
        @for (filter of filters(); track filter.id) {
          <div class="flex items-center justify-between rounded-md border p-2">
            <button hlmBtn variant="ghost" size="sm" class="flex-1 justify-start text-sm" (click)="applyFilter(filter)">
              {{ filter.name }}
            </button>
            <button
              hlmBtn
              variant="ghost"
              size="sm"
              class="h-6 px-2 text-xs text-red-600"
              (click)="confirmDelete(filter)"
            >
              {{ 'filters.delete' | transloco }}
            </button>
          </div>
        } @empty {
          <p class="text-sm text-muted-foreground italic">{{ 'filters.noFilters' | transloco }}</p>
        }
      </div>
    }
  </div>
</hlm-card>

<!-- Delete Confirmation Dialog -->
<ui-confirm-dialog
  [state]="showDeleteConfirm()"
  titleKey="filters.deleteTitle"
  messageKey="filters.deleteConfirm"
  confirmLabelKey="filters.confirmDelete"
  (confirmed)="deleteFilter()"
  (stateChanged)="onDeleteDialogStateChange($event)"
/>
