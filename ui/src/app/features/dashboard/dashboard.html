@if (loading()) {
  <div class="flex items-center justify-center py-20">
    <hlm-spinner />
  </div>
} @else {
  @switch (dashboardState()) {
    @case ('visitor') {
      <ui-landing-page />
    }
    @case ('new-user') {
      <ui-welcome-view [invitations]="invitations()" (invitationHandled)="onInvitationHandled()" />
    }
    @case ('pending-invitations') {
      <ui-invitation-view [invitations]="invitations()" (invitationHandled)="onInvitationHandled()" />
    }
    @case ('member') {
      <ui-member-dashboard [tenants]="tenants()" [tasks]="tasks()" />
    }
    @case ('owner') {
      <ui-owner-dashboard [tenants]="tenants()" [tasks]="tasks()" />
    }
  }
}
