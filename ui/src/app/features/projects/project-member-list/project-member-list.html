<!-- Q2 (F-05): full-height flex column — exactly viewport minus the app header
     (--header-height: 4rem) and the shell <main> vertical padding (p-6 → 2×1.5rem);
     the member table fills the rest so its pagination stays at the page bottom. -->
<div
  class="flex h-[calc(100dvh-var(--header-height)-3rem)] max-sm:h-[calc(100dvh-var(--header-height)-2rem)] w-full min-w-0 flex-col"
>
  <!-- Page header -->
  <div class="mb-6 flex items-center justify-between">
    <h2 class="text-2xl font-bold text-foreground">{{ 'projectMembers.title' | transloco }}</h2>
    @if (canManage() && hasContext()) {
      <button hlmBtn (click)="showAddMember.set(true)">
        <ng-icon name="lucideUserPlus" class="mr-1" />
        {{ 'projectMembers.addMember' | transloco }}
      </button>
    }
  </div>

  <!-- Shared member table (U4) — full-height + Auto rows-per-page (Q2/F-05) -->
  <div class="flex min-h-0 flex-1 flex-col">
    <ui-member-table
      variant="project"
      [rows]="tableRows()"
      [canManage]="canManage()"
      [contextMissing]="!hasContext()"
      [roles]="projectRoles"
      [removingUserId]="removingUserId()"
      [page]="page()"
      [pageSize]="pageSize()"
      [total]="total()"
      [totalPages]="totalPages()"
      [sortField]="sortField()"
      [sortDirection]="sortDirection()"
      [filters]="filterValues()"
      [autoEnabled]="true"
      [isAuto]="isAutoMode()"
      (rowsHeightChange)="autoHeight.set($event)"
      (autoPageSizeChange)="preferencesStore.setPageSize(0)"
      (sortToggle)="table.toggleSort($event)"
      (filterChange)="table.onColumnFilterChange($event.field, $event.value)"
      (pageChange)="table.onPageChange($event)"
      (pageSizeChange)="table.onPageSizeChange($event)"
      (memberChange)="changeRole($event.row, $event.role)"
      (remove)="removeMember($event)"
    />
  </div>

  <!-- Add Member Modal -->
  <hlm-dialog [state]="showAddMember() ? 'open' : 'closed'" (stateChanged)="onAddMemberDialogStateChange($event)">
    <hlm-dialog-content *hlmDialogPortal class="sm:max-w-lg">
      <hlm-dialog-header>
        <h3 hlmDialogTitle>{{ 'projectMembers.addMemberTitle' | transloco }}</h3>
        <p hlmDialogDescription>{{ 'projectMembers.addMemberDesc' | transloco }}</p>
      </hlm-dialog-header>

      @if (error()) {
        <hlm-alert variant="destructive" class="mb-4">
          <div hlmAlertDescription>{{ error() | transloco }}</div>
        </hlm-alert>
      }

      <form id="add-member-form" [formRoot]="addMemberForm" class="flex flex-col gap-4">
        <hlm-field>
          <label hlmFieldLabel for="member-userid">{{ 'projectMembers.userId' | transloco }}</label>
          <input
            hlmInput
            id="member-userid"
            type="text"
            [formField]="addMemberForm.userId"
            [placeholder]="'projectMembers.userIdPlaceholder' | transloco"
          />
        </hlm-field>
        <hlm-field>
          <label hlmFieldLabel for="member-role">{{ 'projectMembers.role' | transloco }}</label>
          <hlm-native-select id="member-role" [formField]="addMemberForm.role">
            @for (role of projectRoles; track role) {
              <option hlmNativeSelectOption [value]="role">{{ role }}</option>
            }
          </hlm-native-select>
        </hlm-field>
      </form>
      <hlm-dialog-footer>
        <button hlmBtn variant="outline" hlmDialogClose>{{ 'projectMembers.cancel' | transloco }}</button>
        <button
          hlmBtn
          type="submit"
          form="add-member-form"
          [disabled]="addMemberForm().invalid() || addMemberForm().submitting()"
        >
          @if (addMemberForm().submitting()) {
            <hlm-spinner /> {{ 'projectMembers.adding' | transloco }}
          } @else {
            <ng-icon name="lucideUserPlus" class="mr-1" />
            {{ 'projectMembers.addMemberButton' | transloco }}
          }
        </button>
      </hlm-dialog-footer>
    </hlm-dialog-content>
  </hlm-dialog>
</div>
