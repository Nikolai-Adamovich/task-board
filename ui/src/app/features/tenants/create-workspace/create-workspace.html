<div class="flex min-h-screen items-center justify-center bg-surface-50">
  <hlm-card class="w-full max-w-md">
    <hlm-card-header>
      <h3 hlmCardTitle>{{ 'createWorkspace.title' | transloco }}</h3>
      <p hlmCardDescription>{{ 'createWorkspace.description' | transloco }}</p>
    </hlm-card-header>

    <div hlmCardContent>
      @if (error()) {
        <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-700" role="alert">
          {{ error() | transloco }}
        </div>
      }

      <form id="workspace-form" [formRoot]="workspaceForm">
        <hlm-field-group>
          <hlm-field>
            <label hlmFieldLabel for="workspace-name">{{ 'createWorkspace.name' | transloco }}</label>
            <input
              hlmInput
              id="workspace-name"
              type="text"
              [formField]="workspaceForm.name"
              placeholder="My Workspace"
            />
            @if (workspaceForm.name().touched() && workspaceForm.name().errors().length) {
              <p hlm-field-error>{{ workspaceForm.name().errors()[0].message | transloco }}</p>
            }
          </hlm-field>
          <hlm-field>
            <label hlmFieldLabel for="workspace-desc">{{ 'createWorkspace.descriptionLabel' | transloco }}</label>
            <textarea
              hlmTextarea
              id="workspace-desc"
              [formField]="workspaceForm.description"
              rows="3"
              [placeholder]="'createWorkspace.descriptionPlaceholder' | transloco"
            ></textarea>
          </hlm-field>
        </hlm-field-group>
      </form>
    </div>

    <hlm-card-footer>
      <button
        hlmBtn
        type="submit"
        form="workspace-form"
        class="w-full"
        [disabled]="workspaceForm().invalid() || workspaceForm().submitting()"
      >
        @if (workspaceForm().submitting()) {
          <hlm-spinner /> {{ 'createWorkspace.submitting' | transloco }}
        } @else {
          {{ 'createWorkspace.submit' | transloco }}
        }
      </button>
    </hlm-card-footer>
  </hlm-card>
</div>
