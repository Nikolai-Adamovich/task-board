<button
  hlmBtn
  variant="ghost"
  size="icon-sm"
  [attr.aria-label]="'header.help' | transloco"
  aria-haspopup="menu"
  [hlmDropdownMenuTrigger]="helpMenu"
>
  <ng-icon name="lucideCircleHelp" />
</button>

<ng-template #helpMenu>
  <hlm-dropdown-menu>
    <button hlmDropdownMenuItem type="button" (click)="openHotkeys()">
      <ng-icon name="lucideKeyboard" />
      <span>{{ 'header.hotkeys' | transloco }}</span>
    </button>
    <a hlmDropdownMenuItem routerLink="/faq">
      <ng-icon name="lucideBookOpen" />
      <span>{{ 'header.faq' | transloco }}</span>
    </a>
    <a hlmDropdownMenuItem routerLink="/docs">
      <ng-icon name="lucideBookOpen" />
      <span>{{ 'header.documentation' | transloco }}</span>
    </a>
    <a hlmDropdownMenuItem routerLink="/support">
      <ng-icon name="lucideLifeBuoy" />
      <span>{{ 'header.support' | transloco }}</span>
    </a>
  </hlm-dropdown-menu>
</ng-template>
