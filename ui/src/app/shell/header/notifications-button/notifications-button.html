<hlm-sheet>
  <button
    hlmSheetTrigger
    side="right"
    hlmBtn
    variant="ghost"
    size="icon-sm"
    [attr.aria-label]="'header.notifications' | transloco"
    aria-haspopup="dialog"
    (click)="sheetOpen.set(true)"
  >
    <ng-icon name="lucideBell" />
  </button>
  <hlm-sheet-content
    *hlmSheetPortal="let ctx"
    side="right"
    class="top-(--header-height) h-[calc(100vh-var(--header-height))]"
  >
    <hlm-sheet-header>
      <h3 hlm-sheet-title>{{ 'header.notifications' | transloco }}</h3>
    </hlm-sheet-header>
    <div class="p-4">
      <p class="text-muted-foreground text-sm">{{ 'header.noNotifications' | transloco }}</p>
    </div>
  </hlm-sheet-content>
</hlm-sheet>
