<div class="relative hidden md:flex">
  <ng-icon name="lucideSearch" class="absolute inset-s-2 top-1/2 -translate-y-1/2 text-muted-foreground" />
  <input
    hlmInput
    class="ps-8 pe-8"
    [placeholder]="'header.search' | transloco"
    [attr.aria-label]="'header.search' | transloco"
    [value]="searchValue()"
    (input)="searchValue.set($any($event.target).value)"
  />
  @if (searchValue()) {
    <button
      type="button"
      class="absolute inset-e-2 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground"
      [attr.aria-label]="'header.clearSearch' | transloco"
      (click)="searchValue.set('')"
    >
      <ng-icon name="lucideX" />
    </button>
  }
</div>
