<header class="flex h-16 items-center justify-between border-b border-border bg-background px-6">
  <div class="flex items-center gap-4">
    <button hlmSidebarTrigger aria-label="Toggle Sidebar"><!-- trigger --></button>
  </div>
  <div class="flex items-center gap-4">
    @if (authStore.currentUser(); as user) {
      <span class="text-sm text-muted-foreground">{{ user.displayName }}</span>
      <button hlmBtn variant="outline" size="sm" (click)="logout()">Logout</button>
    }
  </div>
</header>
