<header class="flex h-16 items-center justify-between border-b border-surface-200 bg-white px-6">
  <div class="flex items-center gap-4">
    <ui-tenant-switcher />
  </div>
  <div class="flex items-center gap-4">
    @if (authStore.currentUser(); as user) {
    <span class="text-sm text-surface-600">{{ user.displayName }}</span>
    <button hlmBtn variant="outline" size="sm" (click)="logout()">
      Logout
    </button>
    }
  </div>
</header>
