<hlm-sheet [state]="open()" (stateChanged)="open.set($event)" side="bottom">
  <button hlmSheetTrigger side="bottom" class="hidden" aria-label="Open theme picker"></button>
  <hlm-sheet-content *hlmSheetPortal="let ctx" side="bottom" class="gap-0" role="dialog" aria-label="Choose theme">
    <hlm-sheet-header class="p-3">
      <h3 hlm-sheet-title class="text-lg font-semibold text-foreground text-center">Themes</h3>
    </hlm-sheet-header>
    <div
      #themeGrid
      class="grid gap-y-4 gap-x-6 py-3 px-6 max-h-89 overflow-y-auto outline-none"
      [style.grid-template-columns]="'repeat(auto-fill, minmax(' + minColumnWidth + ', 1fr))'"
      role="listbox"
      aria-label="Available themes"
      tabindex="0"
      (keydown)="onThemeKeydown($event)"
    >
      @for (theme of themeRegistry.themes(); track theme.id) {
        <button
          hlmBtn
          variant="outline"
          class="flex flex-col items-center justify-center gap-1.5 h-40 w-46 p-2 bg-transparent hover:bg-transparent border-0"
          (click)="selectTheme(theme.id)"
          [attr.data-theme]="theme.id"
          role="option"
          [attr.aria-selected]="getHighlightedTheme() === theme.id"
        >
          <div
            class="flex h-34 w-46 flex-col rounded-lg border"
            [class.ring-2]="getHighlightedTheme() === theme.id"
            [class.ring-primary]="getHighlightedTheme() === theme.id"
            [style.background-color]="theme.preview.card"
            [style.border-color]="theme.preview.border"
          >
            <!-- Header -->
            <div
              class="flex justify-between h-6 items-center border-b rounded-t-lg px-2 grow"
              [style.background-color]="theme.preview.card"
              [style.border-color]="theme.preview.border"
            >
              <div
                class="h-2 w-5 rounded-full"
                [style.background-color]="theme.preview.foreground"
                [style.opacity]="'0.8'"
              ></div>
              <div class="border h-2.5 w-9 rounded-sm" [style.border-color]="theme.preview.border"></div>
              <div class="flex gap-1">
                <div
                  class="h-1.5 w-1.5 rounded-full"
                  [style.background-color]="theme.preview.foreground"
                  [style.opacity]="'0.3'"
                ></div>
                <div
                  class="h-1.5 w-1.5 rounded-full"
                  [style.background-color]="theme.preview.foreground"
                  [style.opacity]="'0.3'"
                ></div>
                <div
                  class="h-1.5 w-1.5 rounded-full"
                  [style.background-color]="theme.preview.foreground"
                  [style.opacity]="'0.3'"
                ></div>
              </div>
            </div>
            <!-- Content -->
            <div class="flex h-28">
              <!-- Sidebar -->
              <div
                class="w-10 border-r rounded-bl-lg p-1 py-2"
                [style.background-color]="theme.preview.card"
                [style.border-color]="theme.preview.border"
              >
                <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
                <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
                <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
                <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
                <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
              </div>
              <div class="flex p-5 grow">
                <!-- Card -->
                <div
                  class="rounded border p-2 justify-center grow"
                  [style.background-color]="theme.preview.card"
                  [style.border-color]="theme.preview.border"
                >
                  <div
                    class="mb-3 h-2 w-6 rounded"
                    [style.background-color]="theme.preview.foreground"
                    [style.opacity]="'0.8'"
                  ></div>
                  <div class="mb-2 h-1.5 w-full rounded" [style.background-color]="theme.preview.muted"></div>
                  <div class="mb-2 h-1.5 w-4/5 rounded" [style.background-color]="theme.preview.muted"></div>
                  <div
                    class="h-3 w-16 rounded-md"
                    [style.background-color]="theme.preview.primary"
                    [style.opacity]="'0.9'"
                  ></div>
                </div>
              </div>
            </div>
          </div>
          <div class="font-medium text-center leading-tight">{{ theme.name }}</div>
        </button>
      }
    </div>
  </hlm-sheet-content>
</hlm-sheet>
