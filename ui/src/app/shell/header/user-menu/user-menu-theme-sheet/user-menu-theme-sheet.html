<hlm-sheet [state]="open()" (stateChanged)="open.set($event)">
  <button hlmSheetTrigger side="bottom" class="hidden" aria-label="Open theme picker"></button>
  <hlm-sheet-content side="bottom" role="dialog" aria-label="Choose theme">
    <hlm-sheet-header>
      <h3 hlm-sheet-title>Themes</h3>
    </hlm-sheet-header>
    <div class="flex flex-col gap-3 p-4">
      <button
        hlmBtn
        variant="outline"
        class="flex items-center gap-3 justify-start h-auto p-4"
        [class.ring-2]="preferencesStore.theme() === 'light'"
        [class.ring-primary]="preferencesStore.theme() === 'light'"
        (click)="selectTheme('light')"
      >
        <div class="flex gap-1">
          <span class="inline-block h-5 w-5 rounded-sm bg-white border border-border"></span>
          <span class="inline-block h-5 w-5 rounded-sm bg-gray-100 border border-border"></span>
          <span class="inline-block h-5 w-5 rounded-sm bg-gray-200 border border-border"></span>
        </div>
        <span class="text-sm font-medium">Light</span>
      </button>
      <button
        hlmBtn
        variant="outline"
        class="flex items-center gap-3 justify-start h-auto p-4"
        [class.ring-2]="preferencesStore.theme() === 'dark'"
        [class.ring-primary]="preferencesStore.theme() === 'dark'"
        (click)="selectTheme('dark')"
      >
        <div class="flex gap-1">
          <span class="inline-block h-5 w-5 rounded-sm bg-gray-800 border border-border"></span>
          <span class="inline-block h-5 w-5 rounded-sm bg-gray-900 border border-border"></span>
          <span class="inline-block h-5 w-5 rounded-sm bg-gray-950 border border-border"></span>
        </div>
        <span class="text-sm font-medium">Dark</span>
      </button>
    </div>
  </hlm-sheet-content>
</hlm-sheet>
