<div class="flex items-center justify-between gap-1">
  <span class="text-sm pl-1">{{ 'userMenu.zoom' | transloco }}</span>
  <div class="flex items-center gap-1">
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      [attr.aria-label]="'userMenu.zoomOut' | transloco"
      [disabled]="preferencesStore.zoom() <= 25"
      (click)="zoomOut()"
    >
      −
    </button>
    <span class="min-w-10 text-center text-sm tabular-nums" aria-live="polite">{{ preferencesStore.zoom() }}%</span>
    <button
      hlmBtn
      variant="ghost"
      size="sm"
      [attr.aria-label]="'userMenu.zoomIn' | transloco"
      [disabled]="preferencesStore.zoom() >= 500"
      (click)="zoomIn()"
    >
      +
    </button>
  </div>
</div>
