<div hlmSidebarWrapper>
  <hlm-sidebar collapsible="icon" class="bg-card">
    <div hlmSidebarHeader>
      <div class="flex items-center gap-2 px-2">
        <h1 class="text-lg font-bold text-sidebar-primary group-data-[collapsible=icon]:hidden">
          {{ 'sidebar.brand' | transloco }}
        </h1>
        <h1 class="text-lg font-bold text-sidebar-primary hidden group-data-[collapsible=icon]:block">
          {{ 'sidebar.brandShort' | transloco }}
        </h1>
      </div>
    </div>

    <div hlmSidebarContent>
      @if (tenantStore.activeTenant(); as tenant) {
        <div hlmSidebarGroup>
          <div hlmSidebarGroupContent>
            <ul hlmSidebarMenu>
              <li hlmSidebarMenuItem class="group-data-[collapsible=icon]:hidden">
                <ui-tenant-switcher />
              </li>
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="['/tenants', tenant.id, 'projects']"
                  routerLinkActive
                  #rlaProjects="routerLinkActive"
                  [isActive]="rlaProjects.isActive"
                  [tooltip]="'sidebar.projects' | transloco"
                  size="lg"
                >
                  <ng-icon name="lucideFolder" />
                  <span class="group-data-[collapsible=icon]:hidden">{{ 'sidebar.projects' | transloco }}</span>
                </a>
              </li>
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="['/tenants', tenant.id, 'sprints']"
                  routerLinkActive
                  #rlaSprints="routerLinkActive"
                  [isActive]="rlaSprints.isActive"
                  [tooltip]="'sidebar.sprints' | transloco"
                  size="lg"
                >
                  <ng-icon name="lucideCalendar" />
                  <span class="group-data-[collapsible=icon]:hidden">{{ 'sidebar.sprints' | transloco }}</span>
                </a>
              </li>
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="['/tenants', tenant.id, 'settings']"
                  routerLinkActive
                  #rlaSettings="routerLinkActive"
                  [isActive]="rlaSettings.isActive"
                  [tooltip]="'sidebar.settings' | transloco"
                  size="lg"
                >
                  <ng-icon name="lucideSettings" />
                  <span class="group-data-[collapsible=icon]:hidden">{{ 'sidebar.settings' | transloco }}</span>
                </a>
              </li>
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="['/tenants', tenant.id, 'settings', 'members']"
                  routerLinkActive
                  #rlaMembers="routerLinkActive"
                  [isActive]="rlaMembers.isActive"
                  [tooltip]="'sidebar.members' | transloco"
                  size="lg"
                >
                  <ng-icon name="lucideUsers" />
                  <span class="group-data-[collapsible=icon]:hidden">{{ 'sidebar.members' | transloco }}</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      }
    </div>

    <div hlmSidebarFooter>
      <button hlmSidebarRail [attr.aria-label]="'sidebar.toggleSidebar' | transloco"></button>
    </div>
  </hlm-sidebar>

  <ng-content />
</div>
