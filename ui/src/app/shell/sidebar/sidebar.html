<div hlmSidebarWrapper>
  <hlm-sidebar collapsible="icon" class="bg-card">
    <div hlmSidebarHeader>
      <div class="flex items-center gap-2 px-2">
        <h1 class="text-lg font-bold text-sidebar-primary group-data-[collapsible=icon]:hidden">Task Board</h1>
        <h1 class="text-lg font-bold text-sidebar-primary hidden group-data-[collapsible=icon]:block">TB</h1>
      </div>
    </div>

    <div hlmSidebarContent>
      @if (tenantStore.activeTenant(); as tenant) {
        <div hlmSidebarGroup>
          <div hlmSidebarGroupContent>
            <ul hlmSidebarMenu>
              <li hlmSidebarMenuItem class="group-data-[collapsible=icon]:hidden">
                <ui-tenant-switcher />
              </li>
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="['/tenants', tenant.id, 'projects']"
                  routerLinkActive
                  #rlaProjects="routerLinkActive"
                  [isActive]="rlaProjects.isActive"
                  tooltip="Projects"
                  size="lg"
                >
                  <ng-icon name="lucideFolder" />
                  <span class="group-data-[collapsible=icon]:hidden">Projects</span>
                </a>
              </li>
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="['/tenants', tenant.id, 'sprints']"
                  routerLinkActive
                  #rlaSprints="routerLinkActive"
                  [isActive]="rlaSprints.isActive"
                  tooltip="Sprints"
                  size="lg"
                >
                  <ng-icon name="lucideCalendar" />
                  <span class="group-data-[collapsible=icon]:hidden">Sprints</span>
                </a>
              </li>
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="['/tenants', tenant.id, 'settings']"
                  routerLinkActive
                  #rlaSettings="routerLinkActive"
                  [isActive]="rlaSettings.isActive"
                  tooltip="Settings"
                  size="lg"
                >
                  <ng-icon name="lucideSettings" />
                  <span class="group-data-[collapsible=icon]:hidden">Settings</span>
                </a>
              </li>
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="['/tenants', tenant.id, 'settings', 'members']"
                  routerLinkActive
                  #rlaMembers="routerLinkActive"
                  [isActive]="rlaMembers.isActive"
                  tooltip="Members"
                  size="lg"
                >
                  <ng-icon name="lucideUsers" />
                  <span class="group-data-[collapsible=icon]:hidden">Members</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      }
    </div>

    <div hlmSidebarFooter>
      <button hlmSidebarRail aria-label="Toggle Sidebar"></button>
    </div>
  </hlm-sidebar>

  <ng-content />
</div>
