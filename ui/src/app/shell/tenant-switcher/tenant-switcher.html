<div class="relative">
  <button
    hlmBtn
    variant="outline"
    size="sm"
    (click)="toggleDropdown()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
  >
    @if (tenantService.activeTenant(); as tenant) {
      <span class="font-medium">{{ tenant.name }}</span>
    } @else {
      <span class="text-muted-foreground">Select tenant</span>
    }
    <ng-icon name="lucideChevronDown" class="ml-1" />
  </button>

  @if (isOpen()) {
    <div
      class="absolute left-0 z-50 mt-1 w-56 rounded-md border border-border bg-popover py-1 shadow-lg"
      role="listbox"
    >
      @for (tenant of tenantService.tenants(); track tenant.id) {
        <button
          class="flex w-full items-center px-3 py-2 text-left text-sm transition-colors hover:bg-accent"
          [class.bg-primary/10]="isActive(tenant)"
          [class.text-primary]="isActive(tenant)"
          [class.text-foreground]="!isActive(tenant)"
          role="option"
          [attr.aria-selected]="isActive(tenant)"
          (click)="selectTenant(tenant)"
        >
          {{ tenant.name }}
          @if (isActive(tenant)) {
            <ng-icon name="lucideCheck" class="ml-auto text-primary" />
          }
        </button>
      } @empty {
        <div class="px-3 py-2 text-sm text-muted-foreground">No tenants available</div>
      }
    </div>
  }
</div>
