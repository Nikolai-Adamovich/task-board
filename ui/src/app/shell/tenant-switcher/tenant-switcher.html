<div class="relative">
  @if (authStore.needsWorkspace()) {
    <button hlmBtn variant="outline" size="lg" class="w-full" (click)="navigateToCreate()">
      <ng-icon name="lucidePlus" class="mr-1" />
      {{ 'tenantSwitcher.createWorkspace' | transloco }}
    </button>
  } @else {
    <button hlmBtn variant="outline" size="lg" class="w-full" [hlmDropdownMenuTrigger]="tenantMenu">
      @if (tenantStore.activeTenant(); as tenant) {
        <span class="font-medium">{{ tenant.name }}</span>
      } @else {
        <span class="text-muted-foreground">{{ 'tenantSwitcher.selectWorkspace' | transloco }}</span>
      }
      <ng-icon name="lucideChevronDown" class="ml-1" />
    </button>

    <ng-template #tenantMenu>
      <div hlmDropdownMenu class="w-full min-w-56">
        @for (tenant of tenantStore.tenants(); track tenant.id) {
          <button hlmDropdownMenuItem (click)="selectTenant(tenant)">
            {{ tenant.name }}
            @if (isActive(tenant)) {
              <ng-icon name="lucideCheck" class="ml-auto text-primary" />
            }
          </button>
        } @empty {
          <div class="px-3 py-2 text-sm text-muted-foreground">{{ 'tenantSwitcher.noWorkspaces' | transloco }}</div>
        }
        <hlm-dropdown-menu-separator />
        <button hlmDropdownMenuItem (click)="navigateToCreate()">
          <ng-icon name="lucidePlus" />
          {{ 'tenantSwitcher.createWorkspace' | transloco }}
        </button>
      </div>
    </ng-template>
  }
</div>
