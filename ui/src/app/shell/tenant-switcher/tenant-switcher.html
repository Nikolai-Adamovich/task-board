<div class="relative">
  @if (authStore.needsWorkspace()) {
    <button hlmBtn variant="outline" size="lg" class="w-full" (click)="navigateToCreate()">
      <ng-icon name="lucidePlus" class="mr-1" />
      Create Workspace
    </button>
  } @else {
    <button
      hlmBtn
      variant="outline"
      size="lg"
      class="w-full"
      (click)="toggleDropdown()"
      aria-haspopup="listbox"
      [attr.aria-expanded]="isOpen()"
    >
      @if (tenantStore.activeTenant(); as tenant) {
        <span class="font-medium">{{ tenant.name }}</span>
      } @else {
        <span class="text-muted-foreground">Select workspace</span>
      }
      <ng-icon name="lucideChevronDown" class="ml-1" />
    </button>

    @if (isOpen()) {
      <div
        class="absolute left-0 z-50 mt-1 w-full rounded-md border border-border bg-popover py-1 shadow-lg"
        role="listbox"
      >
        @for (tenant of tenantStore.tenants(); track tenant.id) {
          <button
            class="flex w-full items-center px-3 py-2 text-left text-sm transition-colors hover:bg-accent"
            [class.bg-primary/10]="isActive(tenant)"
            [class.text-primary]="isActive(tenant)"
            [class.text-foreground]="!isActive(tenant)"
            role="option"
            [attr.aria-selected]="isActive(tenant)"
            (click)="selectTenant(tenant)"
          >
            {{ tenant.name }}
            @if (isActive(tenant)) {
              <ng-icon name="lucideCheck" class="ml-auto text-primary" />
            }
          </button>
        } @empty {
          <div class="px-3 py-2 text-sm text-muted-foreground">No workspaces available</div>
        }
        <div class="border-t border-border">
          <button
            class="flex w-full items-center px-3 py-2 text-left text-sm text-muted-foreground transition-colors hover:bg-accent hover:text-foreground"
            (click)="navigateToCreate()"
          >
            <ng-icon name="lucidePlus" class="mr-2 h-4 w-4" />
            Create Workspace
          </button>
        </div>
      </div>
    }
  }
</div>
