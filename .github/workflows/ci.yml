name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # N-05: non-blocking dependency audit — surfaces high-severity
      # vulnerabilities without failing the pipeline.
      - name: Audit dependencies (high severity, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Lint all packages
        run: npm run lint

      - name: Run server tests
        run: npm test --workspace=server

      - name: Run UI tests
        run: npm test --workspace=ui

      - name: Type-check shared
        run: npm run typecheck --workspace=shared

      - name: Type-check server
        run: npm run typecheck --workspace=server

      # N-04: fast, dedicated UI typecheck (fails before the full build).
      - name: Type-check UI
        run: npm run typecheck --workspace=ui

      - name: Build UI
        run: npm run build --workspace=ui

      # Deployment lives in cd.yml, which is gated on this workflow's success
      # via the `workflow_run` trigger.
