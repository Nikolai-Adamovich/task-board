name: CD

# Deploys only after the CI run that validated the same commit has succeeded.
# `workflow_run` is the only reliable way to sequence two workflows on the same
# push event — a plain `push` trigger would run CD in parallel with CI and
# deploy unvalidated (possibly failing) code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Requires repository secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers + Pages edit permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#   MONGODB_URI           — MongoDB Atlas connection string (Worker secret)
#   JWT_SECRET            — JWT signing secret (Worker secret)
#   RESEND_API_KEY        — optional; when absent the server falls back to ConsoleEmailService
#
# Requires repository variables:
#   PROJECT_NAME — Cloudflare Pages project name (https://PROJECT_NAME.pages.dev)

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Checkout (the exact commit CI validated)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # @task-board/shared resolves to shared/dist (package.json "main"), which is
      # gitignored — the UI build fails without this step.
      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Build frontend
        run: npm run build --workspace=@task-board/ui

      # Idempotent: creates the project on the first run, skips when it already
      # exists. No `|| true` — a real failure (e.g. the API token lacking the
      # "Cloudflare Pages: Edit" permission) must fail the pipeline loudly,
      # otherwise the deploy step below dies with an opaque 7003 error.
      - name: Ensure Pages project exists
        run: |
          if ! npx wrangler pages project list | grep -qw "$PROJECT_NAME"; then
            npx wrangler pages project create "$PROJECT_NAME" --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}

      # Run from the build output: wrangler resolves the Pages Functions
      # directory relative to the CWD (./functions), not the deployed directory.
      #
      # --skip-caching: the project's Pages asset store got corrupted (the
      # differential-upload API reported hashes as "already uploaded" while the
      # assets 404 in production — cf. cloudflare/workers-sdk#14021, #12586).
      # The flag bypasses check-missing deduplication and uploads every file.
      - name: Deploy frontend to Cloudflare Pages
        working-directory: ui/dist/ui/browser
        run: npx wrangler pages deploy . --project-name=${{ vars.PROJECT_NAME }} --branch=main --skip-caching
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # --var overrides the dev defaults in server/wrangler.toml [vars] for this
      # deployment only: strict production boot checks (M-09), the Pages origin
      # for CORS, and the correct base URL for invitation/reset email links.
      - name: Deploy backend to Cloudflare Workers
        working-directory: server
        run: >-
          npx wrangler deploy --var ENVIRONMENT:production --var ALLOWED_ORIGINS:https://${{ vars.PROJECT_NAME
          }}.pages.dev --var FRONTEND_URL:https://${{ vars.PROJECT_NAME }}.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # printf '%s' (not a heredoc) so no trailing newline lands in the secret
      # value — a "\n" suffix can break the MongoDB connection string.
      - name: Set Worker secrets
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '%s' "$MONGODB_URI" | npx wrangler secret put MONGODB_URI
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          fi
